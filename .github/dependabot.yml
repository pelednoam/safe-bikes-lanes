# Keeps the pinned action SHAs (and their "# vX.Y.Z" comments) and the web
# app's npm packages moving. The workflows pin every action to a commit so that
# a moved tag cannot change what runs with this repo's tokens; this is what
# stops those pins going stale.
#
# No pip entry, though the Python dependencies are pinned now, with hashes
# (pipeline/requirements.txt, requirements-dev.txt). Both are compiled by
# `uv pip compile` for CI's platform (see each file's header), which Dependabot's
# pip support would regenerate without those flags. Refresh them by rerunning
# the command at the top of each file, then the Python checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # one PR for the routine bumps, so they do not bury the ones that matter
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # MapLibre is vendored into the page and the APK at a version the map
      # styles are tested against; moving it is a deliberate change.
      - dependency-name: "maplibre-gl"
      # A Capacitor major needs `cap migrate` and changes to the Android
      # project; it is a piece of work, not a bump.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-community/*"
        update-types: ["version-update:semver-major"]

  # The error-report Worker's own package: wrangler, typescript and vitest,
  # pinned exactly like the web app's, and just as stale without this.
  - package-ecosystem: npm
    directory: /reports
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
