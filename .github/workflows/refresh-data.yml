name: Refresh data sources

# Weekly: re-pull all sources (city GIS, MassDOT, crashes, OSM, POIs,
# terrain), rebuild the graph, re-export web data, and push if anything
# changed — the push triggers the Pages deploy. The commit body carries the
# diff stat so new-lane changes are visible in history.
on:
  schedule:
    - cron: "0 6 * * 1"  # weekly (Mondays) — construction data moves fast
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # This job can write releases and start deploys. Checkout would
          # otherwise leave that token in .git/config for every later step —
          # including every package pip is about to install. Only the publish
          # step is given a token, through its own env.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Exact versions and their hashes (pipeline/requirements.txt, compiled
        # from requirements.in), wheels only: an unpinned install meant a new
        # release of any of these, or of anything they pull in, ran here with
        # the week's data publish downstream of it, and a rebuild could not be
        # reproduced from the commit that made it.
        run: |
          pip install --require-hashes --only-binary=:all: -r pipeline/requirements.txt
      - name: Refresh all sources
        working-directory: pipeline
        env:
          MASSDOT_WZDX_API_KEY: ${{ secrets.MASSDOT_WZDX_API_KEY }}
        run: python fetch.py --refresh
      - name: Rebuild graph
        working-directory: pipeline
        run: python build_graph.py
      - name: Export web data
        working-directory: pipeline
        run: python export_web.py
      - name: Rank where-to-build projects
        working-directory: pipeline
        # reads data/graph.pkl, writes web/data/priorities.{geojson,csv}, which
        # publish-data.sh tars into the release asset the app extracts
        run: python priorities.py
      - name: Build the per-city pages
        working-directory: pipeline
        # reads the ranking, writes web/data/cities/*.json and web/<slug>/
        #
        # No argument: CITIES in city_pages.py is the list, and passing one here
        # made this build Somerville alone. index.json then listed one city while
        # the repo shipped committed pages for Cambridge and Lexington whose data
        # files were absent from the snapshot — so every weekly refresh was one
        # deploy away from two broken city pages. The module prints a note about
        # exactly this, into a log nobody reads.
        run: python city_pages.py
      - name: Cache aerial + terrain tiles
        uses: actions/cache@v4
        with:
          path: |
            data/raw/aerial
            data/raw/terrain
          key: tiles-v1-${{ github.run_id }}
          restore-keys: tiles-v1-
      - name: Aerial lane audit (full network)
        working-directory: pipeline
        run: python aerial_audit.py --max-sites 2767
      - name: Rebuild review page
        working-directory: pipeline
        run: python review_page.py
      - name: Publish data tarball + deploy
        # web/data is NOT committed to git (it would bloat history ~200 MB per
        # refresh). Publish it as a release asset the Pages deploy downloads —
        # through the same script a local publish uses, so CI gets its checks:
        # no ranking built on zero joined crashes, and the sanity gate against
        # the snapshot the site is serving. This step used to tar and upload by
        # itself and skipped all of them.
        run: scripts/publish-data.sh
        env:
          GH_TOKEN: ${{ github.token }}
