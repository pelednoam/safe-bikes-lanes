name: Live data health

# Every other check in this repo runs before or during a deploy, on data the same
# job just built. This one reads the deployed site instead, because the failure
# nobody was watching for is a green deploy whose data is later replaced, or
# quietly ages, or arrives with a whole criterion empty — which is what happened
# on 2026-08-10 and went unreported for a week.
#
# It also watches the services the map is drawn from — our own basemap file,
# the MassGIS aerial imagery, terrain, the geocoder, Mapillary — because in
# September 2026 Carto, the basemap then, began serving its raster tiles with
# "API KEY REQUIRED" drawn into the image and 200 OK on the response, and
# visitors noticed before any check did. See scripts/check-map-services.py for
# why it reads content, not status codes.
#
# Daily, and on every push, so it keeps working even if GitHub disables the
# schedule (it does that after 60 days of repository inactivity — a silent stop
# by design, and the exact thing a freshness check exists to catch).
on:
  schedule:
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so leave no token in the checkout's
          # git config for the packages and scripts that run after it to read.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the deployed data
        id: check
        continue-on-error: true
        run: |
          # pipefail explicitly: a plain `run:` uses `bash -e {0}`, where a
          # pipeline exits with the status of its LAST command — so `check | tee`
          # reported tee's success and this watchdog passed three times while the
          # live data was demonstrably wrong. The failure it exists to catch is
          # the failure it had.
          set -o pipefail
          python3 scripts/check-live-data.py 2>&1 | tee /tmp/health.txt

      - name: Check the third-party map services
        id: services
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/check-map-services.py 2>&1 | tee /tmp/services.txt

      - name: Say so where it will be seen
        # A failing scheduled run is an email nobody reads twice. An open issue
        # stays until the data is fixed, and closes itself when it is.
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: bash scripts/report-live-health.sh

      - name: Say so for the map services too
        # Its own issue, not a line in the data one: a broken basemap and stale
        # data have different causes and different fixes, and one issue whose
        # meaning changes from day to day is one nobody can act on.
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.services.outcome }}
          TITLE: Map services health check is failing
          REPORT: /tmp/services.txt
          INTRO: "A service the map is drawn from is down, or answering with something other than what the app expects:"
          REPRO: python3 scripts/check-map-services.py
          HEALTHY: The map services check out again.
          HINT: >-
            A 200 OK proves nothing here: Carto once served every raster tile with
            "API KEY REQUIRED" drawn into the image. A basemap problem is ours:
            re-run the Basemap workflow (scripts/publish-basemap.sh) if the
            release is stale, and redeploy the site if its copy is missing.
        run: bash scripts/report-live-health.sh

      - name: Fail the run if anything is wrong
        if: steps.check.outcome == 'failure' || steps.services.outcome == 'failure'
        run: |
          echo "live data: ${{ steps.check.outcome }}, map services: ${{ steps.services.outcome }}"
          echo "see the issues, and /tmp/health.txt and /tmp/services.txt above"
          exit 1
