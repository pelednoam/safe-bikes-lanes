name: Error-report endpoint

# The Cloudflare Worker the app sends its error reports to (reports/), which
# files them as issues here. Tested on every change to it; deployed from main
# once the Cloudflare secrets exist. Until then the deploy says so and stops,
# and the app, built without REPORT_URL, sends nothing.
on:
  push:
    branches: [main]
    paths: ["reports/**", ".github/workflows/reports.yml"]
  pull_request:
    paths: ["reports/**", ".github/workflows/reports.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check && npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Is Cloudflare set up?
        id: ready
        env:
          ISSUES_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ISSUES_TOKEN" ]; then
            echo "::notice::Not deployed: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and REPORTS_GITHUB_TOKEN (see reports/README.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Only wrangler runs here, with the Cloudflare token: no install scripts,
      # and nothing of the repository's but the Worker's own files.
      - if: steps.ready.outputs.go == 'true'
        run: npm ci --ignore-scripts
      # A new Cloudflare account has no workers.dev subdomain, and wrangler
      # won't pick one outside a terminal: the Worker's address would be
      # https://safe-bikes-reports.<subdomain>.workers.dev. Registered once;
      # the name is the WORKERS_SUBDOMAIN variable, else pelednoam.
      - name: The workers.dev subdomain, registered the first time
        if: steps.ready.outputs.go == 'true'
        env:
          WANTED: ${{ vars.WORKERS_SUBDOMAIN || 'pelednoam' }}
        run: |
          set -o pipefail
          case "$WANTED" in *[!a-z0-9-]*|"") echo "::error::bad subdomain '$WANTED'"; exit 1;; esac
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # have:<name>, missing (Cloudflare's own 10007, "not found", or a success
          # with no subdomain in it), or error. Only "missing" registers one: an API
          # that couldn't be reached or refused the token is not "nothing there yet".
          # What Cloudflare said is shown, one line, on an error: it is its text,
          # not ours, so a "::" at the start of one of its lines is not a command.
          oneline() { printf '%s' "$1" | tr '\r\n' '  ' | cut -c1-300 | sed 's/::/: :/g'; }
          state='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let r;try{r=JSON.parse(s)}catch{process.stdout.write("error");return}const n=r.success&&r.result&&r.result.subdomain;const none=(r.success&&!n)||(r.errors||[]).some(e=>e.code===10007);process.stdout.write(n?"have:"+n:none?"missing":"error")})'
          # One call, used for both requests. curl writes its body to a FILE (-o),
          # not to a variable: on a retry it starts the file again, where captured
          # output could hold a failed attempt's body in front of the good one and
          # fail to parse. Its own messages (a retry, the reason it gave up) go to
          # another file, not in front of the JSON. The body is parsed only if curl
          # succeeded; on failure both are what the error says (or "no answer").
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          # sets two variables for the caller: got (have:<name>, missing or error) and
          # reply (what Cloudflare or curl said)
          cf() {
            : > "$work/body"; : > "$work/err"
            if curl -sS --retry 3 --retry-all-errors -H "$auth" -o "$work/body" "$@" 2> "$work/err"; then
              got=$(node -e "$state" < "$work/body") || got=error
              reply=$(cat "$work/body")
            else
              got=error
              reply="$(cat "$work/body") $(cat "$work/err")"
            fi
            [ -n "${reply//[[:space:]]/}" ] || reply="no answer"
          }
          cf "$api"
          case "$got" in
            have:*) have="${got#have:}" ;;
            missing)
              cf -X PUT -H "content-type: application/json" --data "{\"subdomain\":\"$WANTED\"}" "$api"
              case "$got" in
                have:*) have="${got#have:}"; echo "registered $have.workers.dev" ;;
                *) echo "::error::couldn't register $WANTED.workers.dev: $(oneline "$reply")"; exit 1 ;;
              esac ;;
            *) echo "::error::couldn't read the account's workers.dev subdomain from Cloudflare: $(oneline "$reply")"; exit 1 ;;
          esac
          echo "::notice::The Worker is https://safe-bikes-reports.$have.workers.dev/report"
      - name: The KV namespace, created the first time
        if: steps.ready.outputs.go == 'true'
        run: |
          set -o pipefail
          find_id() {
            npx wrangler kv namespace list |
              node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s.slice(s.indexOf("[")));const n=l.find(x=>x.title==="safe-bikes-reports"||x.title.endsWith("-safe-bikes-reports"));process.stdout.write(n?n.id:"")})'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler kv namespace create safe-bikes-reports
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::no KV namespace"; exit 1; }
          sed -i "s/^id = \"KV_ID\"$/id = \"$id\"/" wrangler.toml
          grep -q "id = \"$id\"" wrangler.toml
      # The label the issues are filed under, which the Worker refuses to file
      # without (an issue without it could never be found again). Idempotent.
      - name: The "error report" label
        if: steps.ready.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
        run: gh label create "error report" --repo "$GITHUB_REPOSITORY" --color B60205 --description "Filed by the app's error reporting" --force
        working-directory: .
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        env:
          ISSUES_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
        run: |
          npx wrangler deploy
          printf '%s' "$ISSUES_TOKEN" | npx wrangler secret put GITHUB_TOKEN
