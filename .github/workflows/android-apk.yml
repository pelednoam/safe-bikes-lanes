name: Build Android APK

# Builds the Capacitor-wrapped Android app. Run manually (Actions tab ->
# "Build Android APK" -> Run workflow) to get a downloadable APK artifact — a
# development build, named for the release it follows (app-v52-dev.1a2b3c4) so
# it installs over that release and is offered the next one; pushing a tag like
# app-v53 builds that release and attaches the APK to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

jobs:
  # Builds, tests and signs. Read-only: npm packages, Gradle plugins and the
  # Capacitor plugins' own build scripts all run here, so none of them gets a
  # token that can write to the repository.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes, so leave no token in the checkout's
          # git config for the packages and scripts that run after it to read.
          persist-credentials: false
      - name: Fetch map data (release tarball — not committed to git)
        # web/data isn't in git; it's published as a release asset. The native
        # E2E gate and the APK bundle both need it, so extract it up front.
        run: |
          for i in 1 2 3 4 5; do
            curl -sL --fail -o web-data.tar.gz \
              https://github.com/${{ github.repository }}/releases/download/data-snapshot/web-data.tar.gz \
              && break
            echo "data tarball not available yet (attempt $i) — retrying in 15s"; sleep 15
          done
          [ -f web-data.tar.gz ] || { echo "::error::map data tarball not found"; exit 1; }
          tar xzf web-data.tar.gz -C web
          echo "extracted $(ls web/data/tiles/*.json | grep -vc manifest) routing tiles"
      - name: Check the data snapshot matches this commit
        run: bash scripts/check-data-format.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
        working-directory: web
      - name: Check + test
        run: npm run check && npm test
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Native app-layer E2E (emulated Capacitor WebView)
        run: npm run e2e:native
        working-directory: web
      - name: Decide the version
        # A tag build is its tag (app-v53 -> versionCode 53). Any other build
        # used to be github.ref_name — "main" — so versionCode 1: it could not
        # install over an installed release, and the updater could not read
        # "main" to offer the next one. See the script for what it is now.
        id: version
        run: python3 .github/scripts/app_version.py >> "$GITHUB_OUTPUT"
      - name: Assemble web bundle + sync
        # app:sync is assemble.sh, then `cap sync android`: the sync is what
        # writes the plugin list (@capacitor/app among them) into the Android
        # project, so it must run on every build rather than rely on the copy
        # committed in git.
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: npm run app:sync
        working-directory: web
      - name: Restore the signing key
        # Every runner is fresh, so Gradle's auto-generated debug keystore
        # differs per build — Android then refuses to install one APK over
        # another. Sign with one stable key held in repo secrets instead.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set — the APK would get a throwaway signature and could not update an installed app"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > web/android/app/signing.jks
          echo "keystore restored ($(stat -c%s web/android/app/signing.jks) bytes)"
      - name: Build release APK
        # Release, not debug. The debug build is debuggable, and Capacitor turns
        # on WebView remote debugging for a debuggable app — the app's storage,
        # rides and saved places included, open to anyone with the phone and a
        # USB cable. Signed with the same stable key as every earlier (debug)
        # release, so it installs over them.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # build.gradle derives versionCode from this (app-v50 -> 50). Without
          # it every APK is versionCode 1 again, silently — which is the state
          # this replaced, and nothing about the build would look wrong.
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: ./gradlew assembleRelease
        working-directory: web/android
      - name: Verify the APK is signed with the expected key
        # The whole point of the stable key is that every APK can update the
        # last one, so prove the build actually used it rather than trusting it.
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECT=$(keytool -exportcert -keystore web/android/app/signing.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | sha256sum | cut -d" " -f1)
          ACTUAL=$(python3 .github/scripts/apk_cert.py \
            web/android/app/build/outputs/apk/release/app-release.apk)
          echo "keystore cert: $EXPECT"
          echo "apk cert:      $ACTUAL"
          [ "$EXPECT" = "$ACTUAL" ] || {
            echo "::error::APK is not signed with the stable key — it could not update an installed app"; exit 1; }
      - name: Check the APK is what it claims to be
        # From the APK itself: the versionCode decided above, not debuggable,
        # no backup, the permissions a ride needs and no more, and the plugins
        # cap sync was meant to include.
        run: >-
          bash .github/scripts/check_apk.sh
          web/android/app/build/outputs/apk/release/app-release.apk
          ${{ steps.version.outputs.version_code }}
      - name: Rename APK
        # The name the updater and the install page link to.
        run: cp web/android/app/build/outputs/apk/release/app-release.apk family-bike-router.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: family-bike-router-apk
          path: family-bike-router.apk

  # Publishes a tag's APK. The only job with write access, and it runs no build
  # code: it downloads the artifact the apk job made and hands it to GitHub.
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # the mirror-refresh step dispatches pages.yml, and gh workflow run is an
      # Actions API write. Without this it fails with a 403 — and it would fail
      # exactly when a release needs mirroring, which is the whole point.
      actions: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: family-bike-router-apk
      - name: Attach to release (tags only)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: family-bike-router.apk
      - name: Refresh the Pages mirror of the APK
        # The site serves /app/family-bike-router.apk and /app/version.json by
        # copying them from releases/latest at *deploy* time, and the in-app
        # updater reads version.json. Publishing a release therefore doesn't
        # reach anyone until Pages happens to rebuild: app-v48 shipped while the
        # mirror still offered v47. Whichever of the two runs second has to
        # trigger the other, so trigger it here.
        #
        # And it has to be workflow_dispatch, not `on: release: [published]` in
        # pages.yml, however much tidier that would read. The release above is
        # created with the default GITHUB_TOKEN, and events raised by that token
        # do not start workflow runs — workflow_dispatch and repository_dispatch
        # are the documented exceptions, which is why this works and the release
        # event wouldn't. Switching would fail silently: the release publishes,
        # no deploy runs, every phone keeps being offered the previous version.
        # Using the release event needs a PAT on the release step instead.
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --repo: this job has no checkout for gh to read the repository from
        run: gh workflow run pages.yml --ref main --repo "${{ github.repository }}"
