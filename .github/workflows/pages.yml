name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing in this workflow pushes, so leave no token in the checkout's
          # git config for the packages and scripts that run after it to read.
          persist-credentials: false
      - name: Fetch map data (published as a release tarball, not committed to git)
        run: |
          for i in 1 2 3 4 5; do
            curl -sL --fail -o web-data.tar.gz \
              https://github.com/${{ github.repository }}/releases/download/data-snapshot/web-data.tar.gz \
              && break
            echo "data tarball not available yet (attempt $i) — retrying in 15s"
            sleep 15
          done
          if [ ! -f web-data.tar.gz ]; then
            echo "::error::map data tarball not found — run scripts/publish-data.sh"; exit 1
          fi
          tar xzf web-data.tar.gz -C web
          echo "extracted $(ls web/data/tiles/*.json | grep -vc manifest) routing tiles, $(ls web/data/nettiles/*.json | grep -vc manifest) network tiles"
      - name: Check the data snapshot matches this commit
        run: bash scripts/check-data-format.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Type-check, test, build
        # test:coverage, not test: the coverage thresholds are the ratchet on unit
        # coverage, and they only apply when --coverage is passed. Running plain
        # `vitest run` here meant nobody saw them fail — a new page entry point
        # (src/build.ts) sat 0%-covered in the global number for a day with every
        # threshold red and the deploy green.
        run: npm run check && npm run test:coverage && npm run build
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser E2E (real app + graph)
        run: npm run e2e
        working-directory: web
      - name: Assemble site
        run: |
          mkdir _site
          cp web/index.html web/*.js web/*.css _site/
          cp web/manifest.json web/icon-192.png web/icon-512.png _site/
          cp -r web/fonts _site/fonts
          cp -r web/install _site/install
          cp -r web/build _site/build
          cp -r web/data _site/data
          # Which build this is, baked into the code and also served as a file.
          # The About box reads the baked copy — that describes the page actually
          # running — and compares it against the file, which describes what the
          # site serves now. A hard refresh that appears to change nothing is
          # otherwise indistinguishable from a deploy that never happened.
          BUILD_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"web","built":"%s","commit":"%s"}\n' \
            "$BUILD_TIME" "$BUILD_COMMIT" > _site/build.json
          # Three plain tokens, never JSON: sed reads \" in a replacement as an
          # escape, so embedding JSON in a string literal silently produced a
          # syntax error and broke the whole app while every step said success.
          sed -i \
            -e "s|__BUILD_VERSION__|web|" \
            -e "s|__BUILD_TIME__|$BUILD_TIME|" \
            -e "s|__BUILD_COMMIT__|$BUILD_COMMIT|" \
            _site/app.js
          if grep -q "__BUILD_VERSION__\|__BUILD_COMMIT__" _site/app.js; then
            echo "::error::build stamp not substituted — About would say 'development build'"
            exit 1
          fi
          # and it is still JavaScript, which "the placeholder is gone" does not say
          node --check _site/app.js || {
            echo "::error::the stamp substitution broke app.js"; exit 1; }
          echo "build stamp: web $BUILD_TIME $BUILD_COMMIT"
          # One directory per city, so the URL is /somerville rather than a
          # query string. Driven by the generator's own index, so adding a city
          # to the pipeline is the only step needed to publish its page.
          if [ -f web/data/cities/index.json ]; then
            # Newline-delimited and shape-checked. slugify() only ever emits
            # [a-z0-9-], but these strings become paths in a `cp -r`, and the
            # build should not depend on a data file honouring that forever.
            python3 -c "import json; print('\n'.join(c['slug'] for c in json.load(open('web/data/cities/index.json'))))" \
              > /tmp/city-slugs.txt
            while IFS= read -r slug; do
              case "$slug" in
                "" | *[!a-z0-9-]* ) echo "  skipping unusable city slug: '$slug'"; continue ;;
              esac
              if [ -d "web/$slug" ]; then
                cp -r "web/$slug" "_site/$slug"
                echo "  city page: /$slug"
              fi
            done < /tmp/city-slugs.txt
          fi
      - name: Publish the app version manifest
        run: |
          mkdir -p _site/app
          # The APK itself is NOT mirrored here: it is 90 MB, Pages allows about
          # 100 GB a month, and a thousand downloads would spend the lot and
          # take the site down. The app links to the release asset instead,
          # which doesn't count against that. Only version.json is served here,
          # because the in-app updater polls it.
          # The releases/latest API lags the download redirect under GitHub's
          # eventual consistency, so retry rather than silently skip
          # version.json (a miss breaks the in-app updater).
          # `|| true` inside the substitution: this step runs under GitHub's
          # default `bash -e -o pipefail`, where a failing command substitution in
          # an assignment exits the step — so one transient API error took the
          # whole Pages deploy down instead of being retried by the loop below.
          TAG=""
          for i in 1 2 3 4 5; do
            TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
                    | jq -r .tag_name || true)
            [ "$TAG" != "null" ] && [ -n "$TAG" ] && break
            echo "release tag not resolved yet (attempt $i) — retrying in 15s"
            sleep 15
          done
          if [ "$TAG" != "null" ] && [ -n "$TAG" ]; then
            printf '{"version": "%s"}\n' "$TAG" > _site/app/version.json
          else
            echo "::warning::could not resolve latest release tag — version.json not written"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5