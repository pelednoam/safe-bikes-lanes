name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs nothing from npm, gets
# the Pages and OIDC permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Everything that installs and runs third-party code — npm ci, vitest,
  # Playwright and the browser it downloads — happens here, with a read-only
  # token. It used to share one job with the deploy, which meant any dev
  # dependency could mint the id-token and publish its own site. What leaves
  # this job is the site artifact, and nothing else.
  build:
    runs-on: ubuntu-latest
    env:
      # the site's build stamp (vite.config.ts); the app's is its release tag
      APP_VERSION: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, so leave no token in the checkout's
          # git config for the packages and scripts that run after it to read.
          persist-credentials: false
      - name: Fetch map data (published as a release tarball, not committed to git)
        run: |
          for i in 1 2 3 4 5; do
            curl -sL --fail -o web-data.tar.gz \
              https://github.com/${{ github.repository }}/releases/download/data-snapshot/web-data.tar.gz \
              && break
            echo "data tarball not available yet (attempt $i) — retrying in 15s"
            sleep 15
          done
          if [ ! -f web-data.tar.gz ]; then
            echo "::error::map data tarball not found — run scripts/publish-data.sh"; exit 1
          fi
          tar xzf web-data.tar.gz -C web
          echo "extracted $(ls web/data/tiles/*.json | grep -vc manifest) routing tiles, $(ls web/data/nettiles/*.json | grep -vc manifest) network tiles"
      - name: Check the data snapshot matches this commit
        run: bash scripts/check-data-format.sh
      - name: Fetch the basemap (published monthly as a release asset)
        # The map's streets, water and names: one file the site serves, read a
        # tile at a time by byte range (web/src/basemap.ts). Checked against the
        # sha256 published beside it, so a truncated download fails here rather
        # than as a map with holes in it.
        run: |
          BASE=https://github.com/${{ github.repository }}/releases/download/basemap
          for i in 1 2 3; do
            curl -sL --fail -o basemap.json "$BASE/basemap.json" &&
              curl -sL --fail -o web/basemap.pmtiles "$BASE/basemap.pmtiles" && break
            echo "basemap download failed (attempt $i), retrying in 15s"; sleep 15
          done
          SHA=$(python3 -c "import json; print(json.load(open('basemap.json'))['sha256'])")
          echo "$SHA  web/basemap.pmtiles" | sha256sum -c --status || {
            echo "::error::basemap.pmtiles doesn't match basemap.json — run scripts/publish-basemap.sh"; exit 1; }
          echo "basemap: $(cat basemap.json)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Fetch the pinned test data
        # The browser suite, and the unit tests that route (tests/routing.test.ts), run on a frozen data build (web/test-data.json), so
        # a weekly rebuild can't fail this gate by moving what a test aims at.
        # Its format is checked like the published snapshot's: code that needs a
        # newer format has to move the pin in the same commit.
        run: npm run test-data && bash ../scripts/check-data-format.sh web/test-data/data
        working-directory: web
      - name: Type-check, test, build
        # test:coverage, not test: the coverage thresholds are the ratchet on unit
        # coverage, and they only apply when --coverage is passed. Running plain
        # `vitest run` here meant nobody saw them fail — a new page entry point
        # (src/build.ts) sat 0%-covered in the global number for a day with every
        # threshold red and the deploy green.
        run: npm run check && npm run test:coverage && npm run build
        working-directory: web
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser E2E (real app, pinned test data)
        run: npm run e2e
        working-directory: web
      - name: Browser E2E on the data being deployed (@live)
        # The few tests written to hold for any sound build (a route is found
        # in every ring, a page draws, an offline map survives the network going),
        # run on web/data, the snapshot this deploy publishes.
        run: npm run e2e:live
        working-directory: web
        env:
          # and on the basemap being deployed, not the pinned test copy
          LIVE_BASEMAP: basemap.pmtiles
      - name: Assemble site
        # dist/ is the Vite build (npm run build, last run by the e2e step):
        # every page, bundled and content-hashed, the vendored MapLibre and the
        # service worker, with its precache list written and checked. The build
        # stamp is baked in by the build itself (APP_VERSION above,
        # vite.config.ts), no longer substituted into app.js with sed.
        run: |
          cp -r web/dist _site
          cp -r web/data _site/data
          cp web/basemap.pmtiles _site/basemap.pmtiles
          # Which build this is, also served as a file. The About box reads the
          # baked copy, which describes the page actually running, and compares
          # it with this, which describes what the site serves now. A hard
          # refresh that appears to change nothing is otherwise indistinguishable
          # from a deploy that never happened.
          BUILD_COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"web","built":"%s","commit":"%s"}\n' \
            "$BUILD_TIME" "$BUILD_COMMIT" > _site/build.json
          echo "build stamp: web $BUILD_TIME $BUILD_COMMIT"
          # City pages: the build makes one for every committed web/<slug>/, but
          # only the cities in this snapshot's own index have data to show.
          # A page without its data is a broken page, so it doesn't go out.
          python3 - <<'PY'
          import json, pathlib, shutil
          site = pathlib.Path("_site")
          index = pathlib.Path("web/data/cities/index.json")
          listed = {c["slug"] for c in json.loads(index.read_text())} if index.exists() else set()
          for page in sorted(site.glob("*/index.html")):
              slug = page.parent.name
              if slug in {"build", "install", "data"}:
                  continue
              if slug in listed:
                  print(f"  city page: /{slug}")
              else:
                  shutil.rmtree(page.parent)
                  print(f"  city page /{slug} left out: not in this snapshot's cities/index.json")
          PY
      - name: Publish the app version manifest
        run: |
          mkdir -p _site/app
          # The APK itself is NOT mirrored here: it is 90 MB, Pages allows about
          # 100 GB a month, and a thousand downloads would spend the lot and
          # take the site down. The app links to the release asset instead,
          # which doesn't count against that. Only version.json is served here,
          # because the in-app updater polls it.
          # The releases/latest API lags the download redirect under GitHub's
          # eventual consistency, so retry rather than silently skip
          # version.json (a miss breaks the in-app updater).
          # `|| true` inside the substitution: this step runs under GitHub's
          # default `bash -e -o pipefail`, where a failing command substitution in
          # an assignment exits the step — so one transient API error took the
          # whole Pages deploy down instead of being retried by the loop below.
          TAG=""
          for i in 1 2 3 4 5; do
            TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
                    | jq -r .tag_name || true)
            [ "$TAG" != "null" ] && [ -n "$TAG" ] && break
            echo "release tag not resolved yet (attempt $i) — retrying in 15s"
            sleep 15
          done
          if [ "$TAG" != "null" ] && [ -n "$TAG" ]; then
            printf '{"version": "%s"}\n' "$TAG" > _site/app/version.json
          else
            echo "::warning::could not resolve latest release tag — version.json not written"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Publishes the artifact the build job made. No checkout, no npm: the only
  # code that runs holding pages:write and id-token:write is GitHub's own
  # (pinned) Pages actions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1