name: Python checks

# The pipeline, the server and the tests that hold them: ruff, mypy --strict
# and pytest. Until this workflow the 245 Python tests ran only on the
# maintainer's machine. Nothing ran them on a push, so a change to fetch.py or
# the safety model reached the weekly data refresh untested. (The web's unit
# tests do cover one cross-language contract, tests/weights.test.ts.)
#
# No data needed: tests that want a built graph skip cleanly on a fresh
# checkout, and everything else builds its own fixtures.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        # the pipeline's own lock plus the checkers, hashed and wheels only,
        # the same rule the weekly refresh installs by
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - name: Lint
        run: ruff check pipeline server tests
      - name: Types
        run: mypy
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
