[project]
name = "family-bike-router"
version = "0.1.0"
description = "Safety-first bike route planner for Cambridge + Somerville, MA"
requires-python = ">=3.12"
dependencies = [
    "osmnx",
    "geopandas",
    "networkx",
    "shapely",
    # scipy: sparse graph + multi-source Dijkstra for the where-to-build
    # accessibility pass (pipeline/priorities.py). Not pulled in transitively.
    "scipy",
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
# dev-only: coverage measurement for the pipeline's logic
dev = ["pytest", "pytest-cov"]

[tool.coverage.run]
source = ["pipeline"]

[tool.coverage.report]
# Scripts whose bodies are network calls and file shuffling: their pure logic is
# tested (see tests/test_fetch.py, tests/test_export_web.py), their __main__
# orchestration is not, and pretending otherwise with a mocked-out shell would
# add lines to the count without adding confidence.
omit = [
    "pipeline/aerial_audit.py",
    "pipeline/mapillary_check.py",
    "pipeline/review_page.py",
    "pipeline/verify_towns3.py",
    "pipeline/elevation.py",
    "pipeline/aerial.py",
]
# Ratchet, not a target: raise it when the number rises, never lower it to pass.
# build() and export() now run whole in tests/test_build_end_to_end.py against a
# six-node network with OSM and the elevation service stubbed, which is what
# took this from 67% to 87%.
fail_under = 85
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
files = ["pipeline", "server", "tests"]
strict = true
ignore_missing_imports = true
# geo libraries (osmnx/geopandas/shapely/networkx) are largely untyped; their
# values arrive as Any, so these two strict flags produce only noise here.
disallow_any_expr = false
warn_return_any = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]
