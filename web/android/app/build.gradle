apply plugin: 'com.android.application'

// app-v50 -> 50. Only a well-formed tag yields a code; anything else stays at 1
// rather than throwing and taking the release down at its last step.
def releaseCode = { String tag ->
    (tag =~ /^app-v(\d+)$/).with { it.matches() ? it.group(1).toInteger() : 1 }
}

android {
    namespace = "com.pelednoam.safebikes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pelednoam.safebikes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Derived from the release tag (app-v50 -> 50), not a literal.
        //
        // It was pinned at 1, so every build claimed to be the same version.
        // Installs still worked — the stable signing key lets one APK replace
        // another, and the in-app updater compares the tag string — but Android
        // itself had no way to tell a newer build from an older one: a downgrade
        // looked identical to an upgrade, and anything that reasons about
        // versionCode (the Play Store, `adb install` without -r, backup and
        // restore) was being told these were all the same app build.
        //
        // Local builds with no tag stay at 1, which is below every released
        // build, so a hand-built APK can never masquerade as a newer one.
        versionCode releaseCode(System.getenv("APP_VERSION") ?: "")
        versionName(System.getenv("APP_VERSION") ?: "dev")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // A stable signing key, supplied by CI from repo secrets. Without this the
    // build falls back to Gradle's auto-generated debug keystore — which is
    // regenerated on every fresh CI runner, so each APK was signed with a
    // different key and Android refused to install any of them over another
    // ("app not installed"). Local builds with no keystore keep the old
    // behaviour so nothing extra is needed to build one by hand.
    def keystoreFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "signing.jks")
    signingConfigs {
        stable {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "safebikes"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.stable
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
